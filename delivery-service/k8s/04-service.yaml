# ============================================
# SERVICE - Exposición de red
# ============================================
apiVersion: v1
kind: Service
metadata:
  name: delivery-service
  namespace: delivery-service
  labels:
    app: delivery-service

spec:
  type: NodePort

  selector:
    app: delivery-service

  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8085
      nodePort: 30085