# ============================================
# APPLICATION CONFIGURATION FOR KUBERNETES
# ============================================
# Payment Service - Configuración para Kubernetes

server:
  port: 8084

spring:
  application:
    name: payment-service

  # ============================================
  # DATASOURCE - PaymentDB
  # ============================================
  datasource:
    url: ${DB_URL:jdbc:postgresql://host.docker.internal:5432/paymentdb}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${POOL_SIZE:10}
      minimum-idle: 5
      connection-timeout: 20000

  # ============================================
  # JPA CONFIGURATION
  # ============================================
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true
    hibernate:
      ddl-auto: ${DDL_AUTO:validate}
    show-sql: ${SHOW_SQL:false}

  # ============================================
  # KAFKA CONFIGURATION
  # ============================================
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:host.docker.internal:9092}
    consumer:
      group-id: payment-service-group-v1
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

# ============================================
# ACTUATOR (Para health checks y Prometheus)
# ============================================
management:
  endpoints:
    web:
      exposure:
        #Agregamos prometheus a la lista
        include: "health,info,metrics,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
      # Always para que K8s pueda leer el detalle si lo necesita
      show-details: always
    prometheus:
      enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
  metrics:
    tags:
      application: order-service
  # === CONFIGURACIÓN DE ZIPKIN Y TRAZABILIDAD ===
  tracing:
    sampling:
      probability: 1.0 # 100% de las peticiones para desarrollo
  zipkin:
    tracing:
      endpoint: "http://host.docker.internal:9411/api/v2/spans"

# ============================================
# LOGGING
# ============================================
logging:
  level:
    com.tecsup.app.micro.payment: ${LOG_LEVEL:INFO}
    org.hibernate.SQL: ${SQL_LOG_LEVEL:WARN}

# ============================================
# JWT CONFIGURATION (Sesión 2)
