# ============================================
# DEPLOYMENT - Gestión de Pods
# ============================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: delivery-service
  namespace: delivery-service
  labels:
    app: delivery-service

spec:
  replicas: 1

  selector:
    matchLabels:
      app: delivery-service

  template:
    metadata:
      labels:
        app: delivery-service

    spec:
      containers:
        - name: delivery-service
          image: delivery-service:1.0.1
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8085
              name: http

          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "kubernetes"

            # Desde ConfigMap
            - name: DB_URL
              valueFrom:
                configMapKeyRef:
                  name: delivery-service-config
                  key: DB_URL

            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: delivery-service-config
                  key: SPRING_KAFKA_BOOTSTRAP_SERVERS

            - name: DDL_AUTO
              valueFrom:
                configMapKeyRef:
                  name: delivery-service-config
                  key: DDL_AUTO

            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: delivery-service-config
                  key: LOG_LEVEL

            - name: JAVA_OPTS
              valueFrom:
                configMapKeyRef:
                  name: delivery-service-config
                  key: JAVA_OPTS

            # Desde Secret
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: delivery-service-secret
                  key: DB_USERNAME

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: delivery-service-secret
                  key: DB_PASSWORD