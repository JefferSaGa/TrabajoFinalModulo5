# ============================================
# Prometheus Configuration (Docker Compose Mode)
# ============================================

global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:

  # Prometheus se monitorea a sí mismo
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # order-service (Alcanzado mediante port-forward local)
  - job_name: 'ordernes-service'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 10s
    static_configs:
      - targets: ['host.docker.internal:8083']
        labels:
          application: 'ordernes-service'

  # payment-service (Alcanzado mediante port-forward local)
  - job_name: 'pagos-service'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 10s
    static_configs:
      - targets: ['host.docker.internal:8084']
        labels:
          application: 'pagos-service'

  - job_name: 'pedidos-service'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 10s
    static_configs:
        - targets: ['host.docker.internal:8085'] #
          labels:
            application: 'pedidos-service'