# ============================================
# SERVICE - Exposición de red
# ============================================
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: payment-service
  labels:
    app: payment-service

spec:
  type: NodePort
  selector:
    app: payment-service
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8084
      nodePort: 30084